# Ежедневный сбор дивидендов и котировок и публикация сайта на GitHub Pages.
name: Обновление данных

on:
  schedule:
    # По будням в 19:37 МСК (16:37 UTC): после закрытия основной сессии Мосбиржи.
    - cron: "37 16 * * 1-5"
    # Утром вт–сб в 06:37 МСК (03:37 UTC): окончательные цены с учётом вечерней сессии
    # и индекс полной доходности MCFTR, который Мосбиржа публикует только после окончания торгов.
    - cron: "37 3 * * 2-6"
  workflow_dispatch:
    inputs:
      dividends:
        description: "Обновить и дивиденды с dohod.ru (дольше; без галочки — только котировки и сайт)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Обычно сборка занимает 3–5 минут; если источник данных завис — прерываем, а не ждём 6 часов.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      # База хранится в кэше Actions между запусками, поэтому котировки догружаются инкрементально.
      # Если кэш пропал (GitHub удаляет неиспользуемые через 7 дней), база соберётся заново (~5 минут).
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: divgap-db-${{ github.run_id }}
          restore-keys: divgap-db-

      # Дивиденды с dohod.ru собираем вечером по расписанию и при ручном запуске с галочкой.
      # Утренний запуск и обычный ручной обновляют только котировки — так быстрее и меньше нагрузка на dohod.ru.
      - name: Сбор данных
        timeout-minutes: 20
        env:
          SKIP_DIVIDENDS: ${{ (github.event_name == 'workflow_dispatch' && !inputs.dividends) || github.event.schedule == '37 3 * * 2-6' }}
        run: |
          if [ "$SKIP_DIVIDENDS" = "true" ]; then
            python -m app.collector --skip-dividends
          else
            python -m app.collector
          fi

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: divgap-db-${{ github.run_id }}

      - name: Тесты
        run: pip install pytest && python -m pytest -q

      - name: Сборка сайта
        run: |
          python -m app.export_static --out _site --standalone
          python -m app.export_static --single _site/dividend-gap.html

      # Однофайловая версия доступна для скачивания на странице запуска (Summary → Artifacts).
      - uses: actions/upload-artifact@v4
        with:
          name: dividend-gap-html
          path: _site/dividend-gap.html
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
